name: HOTFIX Bangku Teras Rumahku
run-name: "HOTFIX Bangku Teras dari ${{ github.ref_name }}"
on:
  push:
    branches:
      - hotfix/bangku-teras-rumahku-20261120
concurrency:
  group: deploy-nusa-island
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  cek:
    name: Uji keluar dari bangku
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright/python:v1.55.0-noble
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Pasang pustaka Playwright (browser sudah ada di image)
        run: python -m pip install --disable-pip-version-check playwright==1.55.0
      - name: Uji bangku teras di layar HP
        run: python tests/browser/test_bangku_teras.py
      - name: Tes logika multiplayer
        run: node tests/unit-mp.js
      - name: Build produksi + cek rilis
        run: |
          # Alamat Worker dibaca dari situs live (sama seperti firebase/scripts/rilis.sh), tidak ditulis di repo.
          API=$(curl -fsS -m 15 https://nusa-island-d2023.web.app/cloud/config.js | grep -oE 'apiBase: "https://nusa-api\.[A-Za-z0-9-]+\.workers\.dev"' | head -1 | sed -E 's/.*"(https:[^"]+)"/\1/' || true)
          [[ "$API" =~ ^https://nusa-api\.([A-Za-z0-9-]+)\.workers\.dev$ ]] || { echo "::error::alamat nusa-api tidak ditemukan di situs live"; exit 1; }
          export NUSA_API_BASE="$API" NUSA_MP_WS="wss://nusa-multiplayer.${BASH_REMATCH[1]}.workers.dev"
          bash firebase/scripts/build-hosting.sh produksi
          node firebase/scripts/cek-rilis.js --build firebase/public
  deploy:
    name: Deploy Hosting hotfix
    needs: cek
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      NUSA_CI: "1"
      NUSA_CONFIRM: "ya"
      NUSA_TARGET: game
      NUSA_API_DEPLOYED: "ya"
      GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
      GCP_DEPLOY_SA: ${{ vars.GCP_DEPLOY_SA }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Login Firebase tanpa kunci (OIDC)
        id: oidc
        if: ${{ vars.GCP_WIF_PROVIDER != '' && vars.GCP_DEPLOY_SA != '' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
          create_credentials_file: true
      - name: Login Firebase cadangan
        if: ${{ steps.oidc.outcome != 'success' }}
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          [ -n "$SA" ] || { echo "::error::Login Firebase belum diatur"; exit 1; }
          umask 077; printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
      - name: Rilis Hosting game saja
        run: bash firebase/scripts/rilis.sh --ci
      - name: Hapus kredensial cadangan
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
