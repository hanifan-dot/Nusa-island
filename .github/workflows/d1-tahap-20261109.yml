# D1 TAHAP — manual, hanya Owner. Mengatur HANYA variable NUSA_D1_MODE pada nusa-api; tidak menyentuh data, game, Hosting, atau multiplayer.
#  kode-off    : deploy backend_sha dengan NUSA_D1_MODE=off (mis. agar /api/d1/reconcile tersedia).
#  shadow      : NUSA_D1_MODE=shadow. Firebase TETAP sumber utama. Wajib bukti = "rekonsiliasi-go" (atestasi Owner: scripts/d1-tahap.mjs rekonsiliasi memberi VERDICT: GO). Ditolak bila kunci salin NUSA_D1_MIGRATE masih "ya".
#  buka-salin  : HANYA NUSA_D1_MIGRATE=ya (mode live dipertahankan, harus off). Mengizinkan tombol "Salin ke D1" di dasbor Owner; TIDAK menyalin apa pun sendiri.
#  tutup-salin : HANYA NUSA_D1_MIGRATE=tidak (mode live dipertahankan).
#  kembali-off : NUSA_D1_MODE=off (rollback tahap; data D1 tidak dihapus).
# Mode ON tidak ada (ditolak kode). NUSA_D1_MIGRATE hanya diubah oleh tahap buka-salin/tutup-salin (tahap lain mempertahankan nilai live).
# POLA DEPLOY AMAN (bukan --keep-vars/--var): config deploy disusun dari variable plain_text LIVE (semuanya, nilai persis) + NUSA_D1_MODE=target + binding D1/assets dari repo, lalu DIBUKTIKAN SEBELUM deploy:
#   (1) .github/scripts/d1-tahap-config.py verify  : tiap variable live ada & sama, tidak ada variable asing, tidak ada nama secret di variable, NUSA_DB id benar, assets ada;
#   (2) wrangler deploy --dry-run                  : daftar binding menurut wrangler = live (+NUSA_D1_MODE) + NUSA_DB + ASSETS.
#   Bila salah satu gagal, atau ada binding live yang tipenya tak bisa dijamin, workflow berhenti SEBELUM deploy. Secret tidak ada di config (wrangler deploy tidak menyentuh secret; terbukti utuh pada Run #2 dan diverifikasi lagi sesudah deploy).
# Sesudah deploy: variable/secret/binding dibandingkan dengan snapshot sebelum; release-status (release-guard compare) dan probe jalur lama (health, Cloud Save, pembayaran/QRIS, SF, Podium) sebelum = sesudah.
# Secret (sudah ada): CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, NUSA_BACKEND_READ_TOKEN; tidak pernah dicetak.
name: D1 Tahap (kode-off / shadow / kembali-off)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/d1-tahap-20261109.yml
  workflow_dispatch:
    inputs:
      tahap:
        description: "kode-off | buka-salin | tutup-salin | shadow | kembali-off | sultan-on | sultan-off"
        type: choice
        options: ["kode-off", "buka-salin", "tutup-salin", "shadow", "kembali-off", "sultan-on", "sultan-off"]
        default: "kode-off"
      backend_sha:
        description: "SHA 40 heksadesimal backend (repo control-center) yang akan ter-deploy; wajib memuat /api/d1/reconcile"
        type: string
        required: true
      konfirmasi:
        description: "Ketik persis nama tahap (mis. shadow)"
        type: string
        required: true
      bukti:
        description: "Hanya tahap shadow: ketik persis rekonsiliasi-go"
        type: string
        required: false
        default: ""
concurrency:
  group: nusa-island-production
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  d1-tahap:
    name: D1 Tahap (${{ inputs.tahap || 'sultan-on' }})
    if: ${{ github.event_name != 'push' || github.event.head_commit.message == 'ci: deploy avatar Sultan backend once' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    env:
      TAHAP: ${{ inputs.tahap || 'sultan-on' }}
      BACKEND_SHA: ${{ inputs.backend_sha || 'dc66571e3e7cc726cd04d7e60c295a945ea5063d' }}
      GUARD_SHA: ff3ab0b574bb4cd8b40b5438826b0049c8737dbb
      D1_ID: 7061d250-a90e-4d42-8374-2a58b5041424
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Hanya Owner, hanya dari main, konfirmasi & SHA benar, tentukan target mode
        env:
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          REF: ${{ github.ref }}
          CONFIRM: ${{ inputs.konfirmasi || (github.event_name == 'push' && 'sultan-on') }}
          BUKTI: ${{ inputs.bukti }}
        run: |
          [ "$ACTOR" = "$OWNER" ] || { echo "::error::Hanya Owner repo yang boleh menjalankan workflow ini."; exit 1; }
          [ "$REF" = "refs/heads/main" ] || { echo "::error::Jalankan hanya dari branch main."; exit 1; }
          [ "$CONFIRM" = "$TAHAP" ] || { echo "::error::Konfirmasi harus persis nama tahap ($TAHAP)."; exit 1; }
          printf '%s' "$BACKEND_SHA" | grep -Eq '^[0-9a-f]{40}$' || { echo "::error::backend_sha harus 40 heksadesimal huruf kecil."; exit 1; }
          case "$TAHAP" in
            kode-off|kembali-off) M=off ;;
            buka-salin) M=keep; echo "MIG_TARGET=ya" >> "$GITHUB_ENV" ;;
            tutup-salin) M=keep; echo "MIG_TARGET=tidak" >> "$GITHUB_ENV" ;;
            sultan-on) M=keep; echo "SULTAN_TARGET=ya" >> "$GITHUB_ENV" ;;
            sultan-off) M=keep; echo "SULTAN_TARGET=tidak" >> "$GITHUB_ENV" ;;
            shadow) M=shadow; [ "$BUKTI" = "rekonsiliasi-go" ] || { echo "::error::Tahap shadow wajib bukti=rekonsiliasi-go (hasil scripts/d1-tahap.mjs rekonsiliasi: VERDICT GO)."; exit 1; } ;;
            *) echo "::error::Tahap tidak dikenal"; exit 1 ;;
          esac
          echo "MODE_TARGET=$M" >> "$GITHUB_ENV"; echo "Target: mode=$M ${MIG_TARGET:+kunci salin NUSA_D1_MIGRATE=$MIG_TARGET }(variable lain dipertahankan; mode on tidak ada)"
      - name: Verifikasi secret tersedia (tanpa menampilkan nilai)
        env:
          RT: ${{ secrets.NUSA_BACKEND_READ_TOKEN }}
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::Secret Cloudflare belum siap."; exit 1; }
          [ -n "$RT" ] || { echo "::error::Secret NUSA_BACKEND_READ_TOKEN belum ada."; exit 1; }
          # bersihkan spasi/baris-baru/awalan Bearer, samarkan, ekspor bersih
          T=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\r\n\t ' | sed -E 's/^[Bb]earer//')
          A=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '\r\n\t ')
          echo "::add-mask::$T"; echo "::add-mask::$A"
          printf '%s' "$A" | grep -Eq '^[a-fA-F0-9]{32}$' || { echo "::error::CLOUDFLARE_ACCOUNT_ID bukan 32 heksadesimal."; exit 1; }
          echo "CLOUDFLARE_API_TOKEN=$T" >> "$GITHUB_ENV"; echo "CLOUDFLARE_ACCOUNT_ID=$A" >> "$GITHUB_ENV"
      - name: Ambil skrip pengaman dari main
        uses: actions/checkout@v4
        with:
          repository: hanifan-dot/Nusa-island
          ref: ${{ github.sha }}
          path: _ci
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Tes pengaman config (pembayaran/QRIS, Firebase, Cloud Save, SF, Podium, secret, binding D1 tidak boleh hilang) — sebelum menyentuh Cloudflare
        run: python3 -W error _ci/.github/scripts/test-d1-tahap-config.py
      - uses: actions/checkout@v4
        with:
          repository: hanifan-dot/nusa-island-control-center
          ref: ${{ env.BACKEND_SHA }}
          token: ${{ secrets.NUSA_BACKEND_READ_TOKEN }}
          persist-credentials: false
          path: backend
      - uses: actions/checkout@v4
        with:
          repository: hanifan-dot/nusa-island-control-center
          ref: ${{ env.GUARD_SHA }}
          token: ${{ secrets.NUSA_BACKEND_READ_TOKEN }}
          persist-credentials: false
          path: guard
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Pastikan backend tepat pada SHA, memuat D1 + rekonsiliasi, skema tetap 3 migrasi, default aman
        run: |
          set -e
          [ "$(git -C backend rev-parse HEAD)" = "$BACKEND_SHA" ] || { echo "::error::Commit backend bukan backend_sha."; exit 1; }
          T=backend/worker/wrangler.toml
          grep -Fxq 'name = "nusa-api"' "$T"; grep -Fxq 'binding = "NUSA_DB"' "$T"; grep -Fxq "database_id = \"$D1_ID\"" "$T"
          grep -Fxq 'NUSA_D1_MODE = "off"' "$T" || { echo "::error::Default toml NUSA_D1_MODE harus off."; exit 1; }
          [ "$(grep -c '^\[vars\]' "$T")" = "1" ] || { echo "::error::[vars] ganda."; exit 1; }
          ! grep -Eq 'NUSA_D1_MIGRATE' "$T" || { echo "::error::NUSA_D1_MIGRATE tidak boleh ada di config."; exit 1; }
          [ "$(ls backend/migrations/*.sql | wc -l)" = "4" ] || { echo "::error::Harus tepat 4 migrasi termasuk Sultan."; exit 1; }
          [ -f backend/migrations/0004_d1_sultan_points.sql ] || { echo "::error::Migrasi Sultan tidak ada."; exit 1; }
          grep -q "reconcile" backend/worker/d1/migrator.js && grep -q "/api/d1/reconcile" backend/worker/index.js || { echo "::error::backend_sha tidak memuat rekonsiliasi."; exit 1; }
      - name: Tes backend dan scan rahasia (tanpa kunci produksi)
        run: |
          cd backend
          npm install --no-package-lock --no-audit --no-fund
          npm test
          npm run scan:secrets
      - name: Baca alamat nusa-api dari game live
        run: |
          LIVE=$(curl -fsS --retry 2 https://nusa-island-d2023.web.app/cloud/config.js)
          API=$(printf '%s' "$LIVE" | grep -oE 'apiBase: "https://nusa-api\.[A-Za-z0-9-]+\.workers\.dev"' | head -1 | cut -d '"' -f 2)
          [ -n "$API" ] || { echo "::error::Alamat API live tidak ditemukan"; exit 1; }
          echo "NUSA_API_BASE=$API" >> "$GITHUB_ENV"
      - name: Snapshot /api/release-status SEBELUM (wajib 200; bila tidak, berhenti sebelum menyentuh produksi)
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/rg"
          CODE=$(curl -sS --retry 3 --max-time 20 -o "$RUNNER_TEMP/rg/rs_before.raw" -w '%{http_code}' "$NUSA_API_BASE/api/release-status" || echo 000)
          [ "$CODE" = "200" ] || { echo "::error::release-status SEBELUM = HTTP $CODE (bukan 200). Berhenti; produksi tidak disentuh."; exit 1; }
          node guard/scripts/release-guard.mjs normalize < "$RUNNER_TEMP/rg/rs_before.raw" > "$RUNNER_TEMP/rg/before.json"
          # Probe kehidupan jalur lama (tanpa token, tanpa menulis): kode HTTP dicatat sebelum, dibandingkan sesudah.
          cat > "$RUNNER_TEMP/probe.sh" <<'PROBE'
          #!/usr/bin/env bash
          # pemakaian: probe.sh <tag>  -> menulis $RUNNER_TEMP/probe_<tag>.txt
          set -u
          out="$RUNNER_TEMP/probe_$1.txt"; : > "$out"
          get(){ printf '%s GET %s\n' "$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' "$NUSA_API_BASE$1" || echo 000)" "$1" >> "$out"; }
          post(){ printf '%s POST %s\n' "$(curl -sS --max-time 20 -X POST -H 'content-type: application/json' -d '{"data":{}}' -o /dev/null -w '%{http_code}' "$NUSA_API_BASE$1" || echo 000)" "$1" >> "$out"; }
          get /api/health; get /api/public-config; get /api/release-status
          post /fn/loadSave; post /fn/writeSave                 # Cloud Save lama
          post /fn/shop_createOrder; post /fn/shop_listOrders   # pembayaran / QRIS (pesanan)
          post /fn/ecoSf2Info; post /fn/ecoSfInfo               # Samudra Follower
          post /fn/leaderboardTop                               # Podium
          cat "$out"
          PROBE
          chmod +x "$RUNNER_TEMP/probe.sh"
          bash "$RUNNER_TEMP/probe.sh" before
          grep -q '^200 GET /api/health' "$RUNNER_TEMP/probe_before.txt" || { echo "::error::Health SEBELUM tidak 200; berhenti."; exit 1; }
          curl -fsS --max-time 20 "$NUSA_API_BASE/api/public-config" -o "$RUNNER_TEMP/rg/pc_before.json"
      - name: Baca konfigurasi Worker SEBELUM (D1 harus sudah terpasang; tanpa mencetak nilai/secret)
        run: |
          set -e
          CODE=$(curl -sS --retry 2 --max-time 30 -o "$RUNNER_TEMP/rg/set_before.json" -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/nusa-api/settings" || echo 000)
          [ "$CODE" = "200" ] || { echo "::error::Gagal membaca konfigurasi nusa-api (HTTP $CODE). Berhenti."; exit 1; }
          node --input-type=commonjs - "$RUNNER_TEMP/rg/set_before.json" "$RUNNER_TEMP/rg/expected.json" <<'NODE'
          const fs = require('node:fs');
          const d = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (!d.success || !Array.isArray(d.result?.bindings)) throw Error('Konfigurasi Worker tidak bisa divalidasi');
          const by = Object.fromEntries(d.result.bindings.map(b => [b.name, b]));
          for (const n of ['FIREBASE_PROJECT_ID', 'NUSA_SHOP_LIVE', 'ENABLE_SHOP_PRODUCTION', 'NUSA_PUBLIC_OPEN', 'NUSA_ECO_INIT_CAP', 'ALLOWED_ORIGINS']) if (by[n]?.type !== 'plain_text') throw Error('Konfigurasi produksi hilang: ' + n);
          if (by.FIREBASE_PROJECT_ID.text !== 'nusa-island-d2023') throw Error('Firebase project salah');
          for (const n of ['GOOGLE_CLIENT_EMAIL', 'GOOGLE_PRIVATE_KEY']) if (by[n]?.type !== 'secret_text') throw Error('Secret produksi tidak tersedia: ' + n);
          const db = by.NUSA_DB; if (!db || db.type !== 'd1' || db.id !== process.env.D1_ID) throw Error('Binding NUSA_DB belum terpasang/benar; jalankan D1 Fondasi Remote dulu.');
          const ok = new Set(['plain_text', 'secret_text', 'assets', 'd1']);
          for (const b of d.result.bindings) if (!ok.has(b.type)) throw Error('Binding memerlukan penanganan khusus: ' + b.type);
          const cur = by.NUSA_D1_MODE?.text ?? '(tidak ada)', mig = by.NUSA_D1_MIGRATE?.text ?? '(tidak ada)';
          console.log('Sekarang: NUSA_D1_MODE=' + cur + ' NUSA_D1_MIGRATE=' + mig + ' → target mode: ' + process.env.MODE_TARGET + (process.env.MIG_TARGET ? ' kunci: ' + process.env.MIG_TARGET : ' (NUSA_D1_MIGRATE tidak diubah)'));
          if (!['off', 'shadow', '(tidak ada)'].includes(cur)) throw Error('NUSA_D1_MODE produksi bernilai tak dikenal; berhenti.');
          if (process.env.TAHAP === 'buka-salin' && cur !== 'off') throw Error('Buka-salin hanya saat NUSA_D1_MODE=off (sekarang ' + cur + ').');
          if (process.env.TAHAP === 'shadow' && mig === 'ya') throw Error('Kunci salin NUSA_D1_MIGRATE masih "ya": tutup dulu di dasbor Cloudflare (ubah ke tidak), lalu ulangi.');
          if (process.env.TAHAP === 'sultan-on' && cur !== 'shadow') throw Error('Sultan hanya boleh dinyalakan saat mode D1 shadow.');
          fs.writeFileSync(process.argv[3], JSON.stringify(d.result.bindings.filter(b => ['plain_text', 'secret_text'].includes(b.type) && b.name !== 'NUSA_D1_MODE' && !(process.env.MIG_TARGET && b.name === 'NUSA_D1_MIGRATE') && !(process.env.SULTAN_TARGET && b.name === 'NUSA_SULTAN')).map(b => ({ name: b.name, type: b.type, text: b.type === 'plain_text' ? b.text : null }))), { mode: 0o600 });
          NODE
      - name: Susun config deploy dari variable LIVE dan buktikan utuh (variable, binding NUSA_DB, assets, secret) — SEBELUM deploy
        run: |
          set -e
          cd backend/worker
          CONFIG=".nusa-d1-tahap-$$.toml"; echo "CONFIG=$CONFIG" >> "$GITHUB_ENV"
          awk '/^\[vars\][[:space:]]*$/ {skip=1; next} /^\[+[^]]+\]+[[:space:]]*$/ {skip=0} !skip {print}' wrangler.toml > ".base-$$.toml"
          grep -Fxq 'name = "nusa-api"' ".base-$$.toml"
          grep -Fxq '[[d1_databases]]' ".base-$$.toml" || { echo "::error::Blok D1 hilang dari config dasar."; exit 1; }
          P="$GITHUB_WORKSPACE/_ci/.github/scripts/d1-tahap-config.py"; SB="$RUNNER_TEMP/rg/set_before.json"
          python3 "$P" build "$SB" ".base-$$.toml" "$CONFIG" "$MODE_TARGET"
          rm -f ".base-$$.toml"
          python3 "$P" verify "$SB" "$CONFIG" "$MODE_TARGET" "$D1_ID"
      - name: Dry-run wrangler dan buktikan daftar binding = live (tanpa --keep-vars/--var; nilai tidak ditampilkan)
        run: |
          set -e
          cd backend/worker
          npx --yes wrangler@4 deploy --config "$CONFIG" --strict --dry-run > "$RUNNER_TEMP/dry.log" 2>&1 || { grep -v '^env\.' "$RUNNER_TEMP/dry.log" | tail -15; echo "::error::Dry-run gagal; deploy dibatalkan."; rm -f "$CONFIG"; exit 1; }
          python3 "$GITHUB_WORKSPACE/_ci/.github/scripts/d1-tahap-config.py" dryrun "$RUNNER_TEMP/rg/set_before.json" "$RUNNER_TEMP/dry.log" "$MODE_TARGET" "$D1_ID" || { rm -f "$CONFIG"; exit 1; }
      - name: Deploy nusa-api (config terbukti utuh; hanya NUSA_D1_MODE berubah; tanpa Hosting/multiplayer)
        run: |
          set -e
          cd backend/worker; trap 'rm -f "$CONFIG"' EXIT
          npx --yes wrangler@4 deploy --config "$CONFIG" --strict > "$RUNNER_TEMP/deploy.log" 2>&1 || { grep -v '^env\.' "$RUNNER_TEMP/deploy.log" | tail -20; echo "::error::Deploy gagal. Periksa health lalu jalankan tahap kembali-off bila perlu."; exit 1; }
          grep -v '^env\.' "$RUNNER_TEMP/deploy.log" | tail -8
      - name: Verifikasi SESUDAH (variable/secret/binding utuh, mode sesuai target, release-status sama, jalur lama hidup)
        run: |
          set -e
          curl -fsS --retry 3 --max-time 20 "$NUSA_API_BASE/api/health" >/dev/null || { echo "::error::Health gagal. Jalankan tahap kembali-off."; exit 1; }
          curl -fsS --retry 2 --max-time 30 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/nusa-api/settings" -o "$RUNNER_TEMP/rg/set_after.json"
          node --input-type=commonjs - "$RUNNER_TEMP/rg/set_after.json" "$RUNNER_TEMP/rg/expected.json" <<'NODE'
          const fs = require('node:fs');
          const d = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const by = Object.fromEntries(d.result.bindings.map(b => [b.name, b]));
          for (const old of JSON.parse(fs.readFileSync(process.argv[3], 'utf8'))) {
            const n = by[old.name];
            if (!n || n.type !== old.type || (old.type === 'plain_text' && n.text !== old.text)) throw Error('PENTING: konfigurasi produksi berubah (' + old.name + '). Periksa rollback nusa-api.');
          }
          const db = by.NUSA_DB; if (!db || db.type !== 'd1' || db.id !== process.env.D1_ID) throw Error('Binding NUSA_DB hilang/berubah');
          const prev = Object.fromEntries(JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/rg/set_before.json', 'utf8')).result.bindings.map(b => [b.name, b]));
          const wantMode = process.env.MODE_TARGET === 'keep' ? (prev.NUSA_D1_MODE?.text ?? 'off') : process.env.MODE_TARGET;
          if ((by.NUSA_D1_MODE?.text ?? 'off') !== wantMode) throw Error('NUSA_D1_MODE bukan ' + wantMode + ' (atur manual di dasbor lalu ulangi verifikasi)');
          if (process.env.MIG_TARGET && by.NUSA_D1_MIGRATE?.text !== process.env.MIG_TARGET) throw Error('NUSA_D1_MIGRATE bukan ' + process.env.MIG_TARGET);
          if (!process.env.MIG_TARGET && by.NUSA_D1_MIGRATE?.text !== prev.NUSA_D1_MIGRATE?.text) throw Error('NUSA_D1_MIGRATE berubah tanpa diminta');
          if (process.env.SULTAN_TARGET && by.NUSA_SULTAN?.text !== process.env.SULTAN_TARGET) throw Error('NUSA_SULTAN bukan ' + process.env.SULTAN_TARGET);
          if (!process.env.SULTAN_TARGET && by.NUSA_SULTAN?.text !== prev.NUSA_SULTAN?.text) throw Error('NUSA_SULTAN berubah tanpa diminta');
          console.log('OK: variabel/secret produksi utuh; NUSA_DB terikat; NUSA_D1_MODE=' + wantMode + '; NUSA_D1_MIGRATE=' + (by.NUSA_D1_MIGRATE?.text ?? '(tidak ada)') + '.');
          require('node:fs').writeFileSync(process.env.GITHUB_ENV, 'MODE_EFF=' + wantMode + '\n', { flag: 'a' });
          NODE
          CODE=$(curl -sS --retry 3 --max-time 20 -o "$RUNNER_TEMP/rg/rs_after.raw" -w '%{http_code}' "$NUSA_API_BASE/api/release-status" || echo 000)
          [ "$CODE" = "200" ] || { echo "::error::release-status SESUDAH = HTTP $CODE"; exit 1; }
          node guard/scripts/release-guard.mjs normalize < "$RUNNER_TEMP/rg/rs_after.raw" > "$RUNNER_TEMP/rg/after.json"
          node guard/scripts/release-guard.mjs compare "$RUNNER_TEMP/rg/before.json" "$RUNNER_TEMP/rg/after.json"
          bash "$RUNNER_TEMP/probe.sh" after
          diff -u "$RUNNER_TEMP/probe_before.txt" "$RUNNER_TEMP/probe_after.txt" || { echo "::error::Kode HTTP jalur lama berubah (health/Cloud Save/pembayaran/SF/Podium)."; exit 1; }
          # metode sesuai rute: status/probe = GET, reconcile = POST (POST ke rute GET-saja memberi 404 dan menyesatkan)
          for r in "GET /api/d1/status" "GET /api/d1/probe" "POST /api/d1/reconcile"; do
            set -- $r
            C=$(curl -sS --max-time 20 -X "$1" -H 'content-type: application/json' ${3:+-d '{}'} -o /dev/null -w '%{http_code}' "$NUSA_API_BASE$2" || echo 000)
            [ "$1" = POST ] && C=$(curl -sS --max-time 20 -X POST -H 'content-type: application/json' -d '{}' -o /dev/null -w '%{http_code}' "$NUSA_API_BASE$2" || echo 000)
            echo "$1 $2 tanpa token = HTTP $C"; case "$C" in 401|403) ;; *) echo "::error::Rute Owner $2 harus terproteksi (401/403), dapat $C."; exit 1 ;; esac
          done
          for p in /d1/v1/status /d1/v1/save /d1/v1/sf; do
            C=$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' "$NUSA_API_BASE$p" || echo 000)
            echo "$p = HTTP $C"
            if [ "${MODE_EFF:-$MODE_TARGET}" = "off" ]; then [ "$C" = "404" ] || { echo "::error::Mode off: $p harus 404, dapat $C."; exit 1; }
            else case "$C" in 401|403|404|405) ;; *) echo "::error::Mode shadow: $p harus 401/403/404/405 tanpa token, dapat $C."; exit 1 ;; esac; fi
          done
          echo "Selesai. Langkah Owner berikutnya: scripts/d1-tahap.mjs status (mode/bound/schemaVersion=3) lalu tahap sesuai urutan."
