# Hotfix indikator Single/multiplayer dan koneksi online-only — rilis game/Hosting SAJA.
# Tidak men-deploy nusa-api, D1, multiplayer, Functions, atau mengubah variable produksi.
name: Deploy Hotfix Status Dunia (Hosting saja)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-sultan-hosting-20261110.yml
  workflow_dispatch:
    inputs:
      game_sha:
        description: "SHA hotfix status dunia yang sudah diuji"
        type: string
        required: true
        default: "6515475cd2ef8734a716ee6fdf02a9f3338d9630"
      konfirmasi:
        description: "Ketik persis deploy-status"
        type: string
        required: true

concurrency:
  group: nusa-island-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Verifikasi lalu deploy Hosting saja
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - name: Hanya Owner, main, SHA teruji, dan konfirmasi tepat
        env:
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          REF: ${{ github.ref }}
          GAME_SHA: ${{ inputs.game_sha || '6515475cd2ef8734a716ee6fdf02a9f3338d9630' }}
          CONFIRM: ${{ inputs.konfirmasi || (github.event_name == 'push' && 'deploy-status') }}
        run: |
          set -e
          [ "$ACTOR" = "$OWNER" ] || { echo "::error::Hanya Owner."; exit 1; }
          [ "$REF" = "refs/heads/main" ] || { echo "::error::Jalankan dari main."; exit 1; }
          [ "$CONFIRM" = "deploy-status" ] || { echo "::error::Konfirmasi harus deploy-status."; exit 1; }
          [ "$GAME_SHA" = "6515475cd2ef8734a716ee6fdf02a9f3338d9630" ] || { echo "::error::Hanya SHA hotfix status dunia teruji yang diizinkan."; exit 1; }

      - uses: actions/checkout@v4
        with:
          repository: hanifan-dot/Nusa-island
          ref: ${{ inputs.game_sha || '6515475cd2ef8734a716ee6fdf02a9f3338d9630' }}
          fetch-depth: 0
          path: game

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Tes status dunia, multiplayer, Sultan dan bukti aset masuk build
        run: |
          set -e
          bash -n game/firebase/scripts/rilis.sh game/firebase/scripts/build-hosting.sh
          node game/tests/unit-online-status.js
          node game/tests/unit-mp.js
          node game/tests/unit-sultan.js
          node game/tests/unit-kontolodon.js
          grep -Fq 'sf2_kontolodon' game/economy/sf2-core.js
          grep -Fq '@devilbesideme_' game/economy/sf2-core.js
          node game/firebase/scripts/cek-rilis.js
          grep -Fq "NW.sultan" game/sultan/client.js
          grep -Fq "sultan/sultan.css" game/index.html
          grep -Fq "sultan" game/firebase/release-manifest.json

      - name: Login Firebase OIDC
        if: ${{ vars.GCP_WIF_PROVIDER != '' && vars.GCP_DEPLOY_SA != '' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
          create_credentials_file: true

      - name: Login Firebase dengan secret cadangan
        if: ${{ vars.GCP_WIF_PROVIDER == '' || vars.GCP_DEPLOY_SA == '' }}
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -e
          [ -n "$SERVICE_ACCOUNT" ] || { echo "::error::FIREBASE_SERVICE_ACCOUNT belum tersedia."; exit 1; }
          umask 077
          printf '%s' "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/nusa-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/nusa-sa.json" >> "$GITHUB_ENV"

      - name: Deploy Firebase Hosting saja
        env:
          NUSA_TARGET: game
          NUSA_CI: "1"
          NUSA_API_DEPLOYED: "ya"
          NUSA_CONFIRM: "ya"
        run: cd game && bash firebase/scripts/rilis.sh --target game --ci

      - name: Verifikasi hotfix status dunia live
        env:
          GAME_SHA: ${{ inputs.game_sha }}
        run: |
          set -e
          SITE=https://nusa-island-d2023.web.app
          ready=tidak
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 20 -H "Cache-Control: no-cache" "$SITE/mp/ui.js?v=$GAME_SHA" | grep -Fq 'Singleplayer · online' && \
               curl -fsS --max-time 20 -H "Cache-Control: no-cache" "$SITE/mp/ui.js?v=$GAME_SHA" | grep -Fq 'netRequired' && \
               curl -fsS --max-time 20 -H "Cache-Control: no-cache" "$SITE/mp/mp.css?v=$GAME_SHA" | grep -Fq '.net-required' && \
               curl -fsS --max-time 20 -H "Cache-Control: no-cache" "$SITE/sultan/client.js?v=$GAME_SHA" | grep -Fq "NW.sultan"; then
              ready=ya
              break
            fi
            sleep 5
          done
          [ "$ready" = "ya" ] || { echo "::error::Hotfix status dunia belum terlihat di Hosting."; exit 1; }
          echo "OK: hotfix status dunia terdeploy. nusa-api, D1, multiplayer, dan Firestore tidak disentuh."

      - name: Bersihkan kredensial sementara
        if: always()
        run: rm -f "$RUNNER_TEMP/nusa-sa.json"

