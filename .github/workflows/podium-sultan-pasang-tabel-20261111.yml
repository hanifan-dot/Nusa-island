# Podium Sultan — memasang tabel D1 saja. Tidak deploy Worker, tidak mengubah variable, Firestore, Hosting, atau mode D1.
name: Podium Sultan — Pasang Tabel D1
on:
  workflow_dispatch:
    inputs:
      backend_sha:
        description: "SHA 40 karakter backend yang memuat migrations/0004_d1_sultan_points.sql"
        required: true
        type: string
      konfirmasi:
        description: "Ketik persis pasang-tabel-sultan"
        required: true
        type: string
concurrency:
  group: nusa-island-production
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  migrate:
    name: Pasang dan verifikasi tabel Sultan
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      BACKEND_SHA: ${{ inputs.backend_sha }}
      D1_ID: 7061d250-a90e-4d42-8374-2a58b5041424
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Guard Owner, main, SHA, dan konfirmasi
        env:
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          REF: ${{ github.ref }}
          CONFIRM: ${{ inputs.konfirmasi }}
          RT: ${{ secrets.NUSA_BACKEND_READ_TOKEN }}
        run: |
          [ "$ACTOR" = "$OWNER" ] || { echo "::error::Hanya Owner."; exit 1; }
          [ "$REF" = "refs/heads/main" ] || { echo "::error::Jalankan dari main."; exit 1; }
          [ "$CONFIRM" = "pasang-tabel-sultan" ] || { echo "::error::Konfirmasi salah."; exit 1; }
          printf '%s' "$BACKEND_SHA" | grep -Eq '^[0-9a-f]{40}$' || { echo "::error::SHA harus 40 heksadesimal."; exit 1; }
          [ -n "$RT" ] && [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::Secret belum siap."; exit 1; }
      - uses: actions/checkout@v4
        with:
          repository: hanifan-dot/nusa-island-control-center
          ref: ${{ env.BACKEND_SHA }}
          token: ${{ secrets.NUSA_BACKEND_READ_TOKEN }}
          persist-credentials: false
          path: backend
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verifikasi sumber migrasi dan tes backend
        run: |
          [ "$(git -C backend rev-parse HEAD)" = "$BACKEND_SHA" ]
          [ -f backend/migrations/0004_d1_sultan_points.sql ] || { echo "::error::Migrasi Sultan tidak ada."; exit 1; }
          grep -q 'CREATE TABLE IF NOT EXISTS sultan_order' backend/migrations/0004_d1_sultan_points.sql
          grep -q 'CREATE TABLE IF NOT EXISTS sultan_score' backend/migrations/0004_d1_sultan_points.sql
          grep -Fxq 'binding = "NUSA_DB"' backend/worker/wrangler.toml
          grep -Fxq "database_id = \"$D1_ID\"" backend/worker/wrangler.toml
          cd backend
          npm install --no-package-lock --no-audit --no-fund
          npm test
          npm run scan:secrets
      - name: Terapkan migrasi remote D1
        working-directory: backend/worker
        run: npx --yes wrangler@4 d1 migrations apply nusa-player-data --remote --config wrangler.toml
      - name: Verifikasi tabel ada dan schemaVersion pemain tetap 3
        working-directory: backend/worker
        run: |
          npx --yes wrangler@4 d1 execute nusa-player-data --remote --config wrangler.toml --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('sultan_order','sultan_score') ORDER BY name;" > "$RUNNER_TEMP/sultan-tables.txt"
          grep -q 'sultan_order' "$RUNNER_TEMP/sultan-tables.txt"
          grep -q 'sultan_score' "$RUNNER_TEMP/sultan-tables.txt"
          npx --yes wrangler@4 d1 execute nusa-player-data --remote --config wrangler.toml --command "SELECT version FROM d1_schema_info LIMIT 1;" > "$RUNNER_TEMP/schema.txt"
          grep -Eq '(^|[^0-9])3([^0-9]|$)' "$RUNNER_TEMP/schema.txt" || { echo "::error::schemaVersion pemain bukan 3."; exit 1; }
          echo "OK: tabel Sultan terpasang; schemaVersion pemain tetap 3; Worker/variable/Firestore/Hosting tidak disentuh."
