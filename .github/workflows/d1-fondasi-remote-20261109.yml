# D1 FONDASI REMOTE — manual, hanya Owner. Dua mode:
#  pasang-d1-off  : (konfirmasi "migrasi-d1-off") backend dipin 2283d49 (merge PR #46 + #47). Migrasi skema D1 0001-0003 ke nusa-player-data (remote) lalu deploy nusa-api dengan NUSA_D1_MODE="off".
#  rollback-pre-d1: (konfirmasi "rollback-pre-d1") kembalikan kode nusa-api ke backend produksi sebelumnya 25e827b, mempertahankan SEMUA variable/secret produksi,
#                   dan MENGHAPUS binding NUSA_DB + variable NUSA_D1_MODE dari Worker. Tabel/data di D1 TIDAK dihapus dan D1 tidak disentuh. Bisa dijalankan meski Worker live sudah punya binding bertipe d1.
# Kedua mode: berhenti sebelum menyentuh produksi bila /api/release-status tidak 200; release-status dibandingkan sebelum/sesudah.
# TIDAK: deploy game/Hosting/multiplayer, mengaktifkan shadow/on, NUSA_D1_MIGRATE, migrasi data pemain, menulis Firestore. Secret (sudah ada): CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, NUSA_BACKEND_READ_TOKEN; tidak pernah dicetak.
# Verifikasi /api/d1/status & /api/d1/probe butuh token Owner Firebase yang TIDAK ada di CI: CI membuktikan bound/mode lewat daftar binding Worker di Cloudflare + rute terproteksi; Owner mengecek manual sesudahnya.
# CATATAN: workflow rilis biasa (rilis-*.yml) kini memakai .github/scripts/deploy-api-kandidat.sh yang MEMPERTAHANKAN binding d1 (NUSA_DB). Tetapi rollback ke backend PRA-D1 tetap ditolak olehnya (agar binding tidak terhapus tanpa sengaja): untuk itu pakai mode rollback-pre-d1 di workflow ini.
#   ("Binding memerlukan penanganan khusus: d1"). Gunakan mode rollback-pre-d1 di workflow ini.
name: D1 Fondasi Remote (pasang OFF / rollback)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "pasang-d1-off = migrasi D1 + deploy mode OFF. rollback-pre-d1 = kode pra-D1 (25e827b), hapus binding NUSA_DB + NUSA_D1_MODE (tabel D1 tidak dihapus)."
        type: choice
        options: ["pasang-d1-off", "rollback-pre-d1"]
        default: "pasang-d1-off"
      konfirmasi:
        description: "Ketik persis: migrasi-d1-off (mode pasang) ATAU rollback-pre-d1 (mode rollback)"
        type: string
        required: true
concurrency:
  group: nusa-island-production
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  d1-off:
    name: D1 Fondasi Remote (${{ inputs.mode }})
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    env:
      MODE: ${{ inputs.mode }}
      BACKEND_SHA: 2283d49cbef5a2e02961e88503636d44dc3741cb
      ROLLBACK_SHA: 25e827b63c4fc579f293db49b0ca48972c0cffc6
      TARGET_SHA: ${{ inputs.mode == 'rollback-pre-d1' && '25e827b63c4fc579f293db49b0ca48972c0cffc6' || '2283d49cbef5a2e02961e88503636d44dc3741cb' }}
      GUARD_SHA: ff3ab0b574bb4cd8b40b5438826b0049c8737dbb
      D1_NAME: nusa-player-data
      D1_ID: 7061d250-a90e-4d42-8374-2a58b5041424
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Hanya Owner, hanya dari main, konfirmasi persis
        env:
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          REF: ${{ github.ref }}
          CONFIRM: ${{ inputs.konfirmasi }}
          IN_MODE: ${{ inputs.mode }}
        run: |
          [ "$ACTOR" = "$OWNER" ] || { echo "::error::Hanya Owner repo yang boleh menjalankan workflow ini."; exit 1; }
          [ "$REF" = "refs/heads/main" ] || { echo "::error::Jalankan hanya dari branch main."; exit 1; }
          case "$IN_MODE" in
            pasang-d1-off)   [ "$CONFIRM" = "migrasi-d1-off" ] || { echo "::error::Mode pasang-d1-off: konfirmasi harus persis migrasi-d1-off"; exit 1; } ;;
            rollback-pre-d1) [ "$CONFIRM" = "rollback-pre-d1" ] || { echo "::error::Mode rollback-pre-d1: konfirmasi harus persis rollback-pre-d1"; exit 1; } ;;
            *) echo "::error::Mode tidak dikenal"; exit 1 ;;
          esac
      - name: Verifikasi secret tersedia (tanpa menampilkan nilai)
        env:
          RT: ${{ secrets.NUSA_BACKEND_READ_TOKEN }}
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::Secret Cloudflare belum siap."; exit 1; }
          [ -n "$RT" ] || { echo "::error::Secret NUSA_BACKEND_READ_TOKEN belum ada."; exit 1; }
          # bersihkan spasi/baris-baru/awalan Bearer, samarkan, ekspor bersih
          T=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\r\n\t ' | sed -E 's/^[Bb]earer//')
          A=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '\r\n\t ')
          echo "::add-mask::$T"; echo "::add-mask::$A"
          printf '%s' "$A" | grep -Eq '^[a-fA-F0-9]{32}$' || { echo "::error::CLOUDFLARE_ACCOUNT_ID bukan 32 heksadesimal."; exit 1; }
          echo "CLOUDFLARE_API_TOKEN=$T" >> "$GITHUB_ENV"; echo "CLOUDFLARE_ACCOUNT_ID=$A" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          repository: hanifan-dot/nusa-island-control-center
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.NUSA_BACKEND_READ_TOKEN }}
          persist-credentials: false
          path: backend
      - uses: actions/checkout@v4
        with:
          repository: hanifan-dot/nusa-island-control-center
          ref: ${{ env.GUARD_SHA }}
          token: ${{ secrets.NUSA_BACKEND_READ_TOKEN }}
          persist-credentials: false
          path: guard
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Pastikan backend tepat pada SHA terpin dan berisi fondasi + binding D1 (OFF)
        if: ${{ inputs.mode == 'pasang-d1-off' }}
        run: |
          set -e
          [ "$(git -C backend rev-parse HEAD)" = "$BACKEND_SHA" ] || { echo "::error::Commit backend bukan SHA terpin."; exit 1; }
          T=backend/worker/wrangler.toml
          grep -Fxq 'name = "nusa-api"' "$T"
          grep -Fxq 'binding = "NUSA_DB"' "$T"
          grep -Fxq 'database_name = "nusa-player-data"' "$T"
          grep -Fxq "database_id = \"$D1_ID\"" "$T"
          grep -Fxq 'migrations_dir = "../migrations"' "$T"
          grep -Fxq 'NUSA_D1_MODE = "off"' "$T"
          [ "$(grep -c '^\[vars\]' "$T")" = "1" ] || { echo "::error::[vars] ganda."; exit 1; }
          ! grep -Eq 'NUSA_D1_MIGRATE' "$T" || { echo "::error::NUSA_D1_MIGRATE tidak boleh ada di config."; exit 1; }
          ls backend/migrations
          [ "$(ls backend/migrations/*.sql | wc -l)" = "3" ]
          for f in 0001_d1_foundation 0002_d1_samudra_podium 0003_d1_migration_jobs; do test -s "backend/migrations/$f.sql"; done
          for f in api store migrator d1db project fs-source; do test -s "backend/worker/d1/$f.js"; done
          ! grep -Eiq 'DROP[[:space:]]|DELETE[[:space:]]+FROM' backend/migrations/*.sql || { echo "::error::SQL migrasi mengandung DROP/DELETE."; exit 1; }
      - name: Pastikan backend rollback = 25e827b dan BEBAS D1 (tanpa binding/mode D1)
        if: ${{ inputs.mode == 'rollback-pre-d1' }}
        run: |
          set -e
          [ "$(git -C backend rev-parse HEAD)" = "$ROLLBACK_SHA" ] || { echo "::error::Commit backend bukan 25e827b."; exit 1; }
          T=backend/worker/wrangler.toml
          grep -Fxq 'name = "nusa-api"' "$T"
          ! grep -Eiq 'd1_databases|NUSA_DB|NUSA_D1' "$T" || { echo "::error::Config rollback mengandung D1."; exit 1; }
          ! test -e backend/worker/d1 || { echo "::error::Kode D1 ada di backend rollback."; exit 1; }
          [ "$(grep -c '^\[vars\]' "$T")" = "1" ]
      - name: Tes backend dan scan rahasia (tanpa kunci produksi)
        run: |
          cd backend
          npm install --no-package-lock --no-audit --no-fund
          npm test
          npm run scan:secrets
      - name: Baca alamat nusa-api dari game live
        run: |
          LIVE=$(curl -fsS --retry 2 https://nusa-island-d2023.web.app/cloud/config.js)
          API=$(printf '%s' "$LIVE" | grep -oE 'apiBase: "https://nusa-api\.[A-Za-z0-9-]+\.workers\.dev"' | head -1 | cut -d '"' -f 2)
          [ -n "$API" ] || { echo "::error::Alamat API live tidak ditemukan"; exit 1; }
          echo "NUSA_API_BASE=$API" >> "$GITHUB_ENV"
      - name: Snapshot /api/release-status SEBELUM (wajib 200; bila tidak, berhenti sebelum menyentuh produksi)
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/rg"
          CODE=$(curl -sS --retry 3 --max-time 20 -o "$RUNNER_TEMP/rg/rs_before.raw" -w '%{http_code}' "$NUSA_API_BASE/api/release-status" || echo 000)
          [ "$CODE" = "200" ] || { echo "::error::release-status SEBELUM = HTTP $CODE (bukan 200). Berhenti; produksi tidak disentuh."; exit 1; }
          node guard/scripts/release-guard.mjs normalize < "$RUNNER_TEMP/rg/rs_before.raw" > "$RUNNER_TEMP/rg/before.json"
          if [ "$MODE" = "pasang-d1-off" ]; then
            for p in /d1/v1/status /d1/v1/save; do
              C=$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' "$NUSA_API_BASE$p" || echo 000)
              echo "Baseline $p = HTTP $C"; [ "$C" = "404" ] || { echo "::error::Baseline $p harus 404 (D1 belum aktif); dapat $C."; exit 1; }
            done
          fi
          # Probe kehidupan jalur lama (tanpa token, tanpa menulis): kode HTTP dicatat sebelum, dibandingkan sesudah.
          cat > "$RUNNER_TEMP/probe.sh" <<'PROBE'
          #!/usr/bin/env bash
          # pemakaian: probe.sh <tag>  -> menulis $RUNNER_TEMP/probe_<tag>.txt
          set -u
          out="$RUNNER_TEMP/probe_$1.txt"; : > "$out"
          get(){ printf '%s GET %s\n' "$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' "$NUSA_API_BASE$1" || echo 000)" "$1" >> "$out"; }
          post(){ printf '%s POST %s\n' "$(curl -sS --max-time 20 -X POST -H 'content-type: application/json' -d '{"data":{}}' -o /dev/null -w '%{http_code}' "$NUSA_API_BASE$1" || echo 000)" "$1" >> "$out"; }
          get /api/health; get /api/public-config; get /api/release-status
          post /fn/loadSave; post /fn/writeSave                 # Cloud Save lama
          post /fn/shop_createOrder; post /fn/shop_listOrders   # pembayaran / QRIS (pesanan)
          post /fn/ecoSf2Info; post /fn/ecoSfInfo               # Samudra Follower
          post /fn/leaderboardTop                               # Podium
          cat "$out"
          PROBE
          chmod +x "$RUNNER_TEMP/probe.sh"
          bash "$RUNNER_TEMP/probe.sh" before
          grep -q '^200 GET /api/health' "$RUNNER_TEMP/probe_before.txt" || { echo "::error::Health SEBELUM tidak 200; berhenti."; exit 1; }
          curl -fsS --max-time 20 "$NUSA_API_BASE/api/public-config" -o "$RUNNER_TEMP/rg/pc_before.json"
      - name: Baca konfigurasi Worker SEBELUM (binding tipe aman saja; tanpa mencetak nilai/secret)
        run: |
          set -e
          CODE=$(curl -sS --retry 2 --max-time 30 -o "$RUNNER_TEMP/rg/set_before.json" -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/nusa-api/settings" || echo 000)
          [ "$CODE" = "200" ] || { echo "::error::Gagal membaca konfigurasi nusa-api (HTTP $CODE). Cek izin token. Berhenti."; exit 1; }
          node --input-type=commonjs - "$RUNNER_TEMP/rg/set_before.json" "$RUNNER_TEMP/rg/expected.json" <<'NODE'
          const fs = require('node:fs');
          const d = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (!d.success || !Array.isArray(d.result?.bindings)) throw Error('Konfigurasi Worker tidak bisa divalidasi');
          const by = Object.fromEntries(d.result.bindings.map(b => [b.name, b]));
          for (const n of ['FIREBASE_PROJECT_ID', 'NUSA_SHOP_LIVE', 'ENABLE_SHOP_PRODUCTION', 'NUSA_PUBLIC_OPEN', 'NUSA_ECO_INIT_CAP', 'ALLOWED_ORIGINS']) if (by[n]?.type !== 'plain_text') throw Error('Konfigurasi produksi hilang: ' + n);
          if (by.FIREBASE_PROJECT_ID.text !== 'nusa-island-d2023') throw Error('Firebase project salah');
          for (const n of ['GOOGLE_CLIENT_EMAIL', 'GOOGLE_PRIVATE_KEY']) if (by[n]?.type !== 'secret_text') throw Error('Secret produksi tidak tersedia: ' + n);
          if (process.env.MODE === 'pasang-d1-off' && by.NUSA_D1_MODE && by.NUSA_D1_MODE.text !== 'off') throw Error('NUSA_D1_MODE produksi bukan off; berhenti.');
          for (const n of ['NUSA_D1_MIGRATE']) if (by[n]) throw Error(n + ' ada di produksi; berhenti (hapus dulu secara sadar).');
          const ok = new Set(['plain_text', 'secret_text', 'assets', 'd1']);
          for (const b of d.result.bindings) if (!ok.has(b.type)) throw Error('Binding memerlukan penanganan khusus: ' + b.type);
          fs.writeFileSync(process.argv[3] + '.assets', JSON.stringify(d.result.bindings.filter(b => b.type === 'assets').map(b => b.name)));
          fs.writeFileSync(process.argv[3], JSON.stringify(d.result.bindings.filter(b => ['plain_text', 'secret_text'].includes(b.type) && b.name !== 'NUSA_D1_MODE').map(b => ({ name: b.name, type: b.type, text: b.type === 'plain_text' ? b.text : null }))), { mode: 0o600 });
          console.log('OK: konfigurasi produksi terdeteksi; D1 binding sudah ada: ' + (by.NUSA_DB ? 'ya' : 'belum'));
          NODE
      - name: Preflight D1 baca-saja (bedakan izin token / Account ID / Database ID sebelum migrasi)
        if: ${{ inputs.mode == 'pasang-d1-off' }}
        run: |
          set -u
          # Hanya GET + satu "SELECT 1"; tidak mengubah apa pun. Token tidak pernah dicetak.
          B="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          OUT="$RUNNER_TEMP/pf.json"
          call(){
            local m="$1" p="$2" b="${3:-}"
            if [ -n "$b" ]; then
              CODE=$(curl -sS --max-time 30 -X "$m" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'content-type: application/json' -d "$b" -o "$OUT" -w '%{http_code}' "$B$p" || echo 000)
            else
              CODE=$(curl -sS --max-time 30 -X "$m" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o "$OUT" -w '%{http_code}' "$B$p" || echo 000)
            fi
            ERR=$(node -e 'try{const d=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));const e=(d.errors||[])[0];console.log(e?e.code+": "+String(e.message).slice(0,120):"-")}catch{console.log("-")}' "$OUT")
          }
          # 1. Token valid untuk akun ini? (informasi)
          call GET /tokens/verify
          echo "[1] Token (akun) verify : HTTP $CODE  galat=$ERR"
          # 2. Account ID: Worker nusa-api sudah terbaca di langkah sebelumnya dengan Account ID + token yang sama.
          echo "[2] Account ID          : valid untuk Workers (langkah 'Baca konfigurasi Worker SEBELUM' sudah 200)"
          # 3. Izin D1 pada akun: daftar database
          call GET "/d1/database?per_page=100"
          LCODE="$CODE"; LERR="$ERR"
          echo "[3] Daftar D1 akun      : HTTP $LCODE  galat=$LERR"
          if [ "$LCODE" != "200" ]; then
            echo "::error::PENYEBAB: token TIDAK punya izin Account > D1 (HTTP $LCODE, galat $LERR). Account ID benar karena Workers terbaca dengan token yang sama. Buat token dengan Account > D1 > Edit lalu perbarui secret CLOUDFLARE_API_TOKEN. Tidak ada perubahan produksi."
            exit 1
          fi
          # 4. Database ID milik akun ini?
          POS=$(node -e 'const d=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));const l=d.result||[];const byId=l.find(x=>x.uuid===process.env.D1_ID);const byName=l.find(x=>x.name===process.env.D1_NAME);console.log(byId?"id-ada":(byName?"nama-ada-id-beda":"tidak-ada"));console.error("jumlah database di akun: "+l.length)' "$OUT")
          echo "[4] Database di akun    : $POS"
          if [ "$POS" = "tidak-ada" ]; then
            echo "::error::PENYEBAB: Database ID $D1_ID dan nama $D1_NAME TIDAK ada di akun Cloudflare ini. Database kemungkinan dibuat di akun lain, atau CLOUDFLARE_ACCOUNT_ID menunjuk akun berbeda dari akun database. Cocokkan Account ID di Dashboard (D1 > nusa-player-data). Tidak ada perubahan produksi."
            exit 1
          fi
          if [ "$POS" = "nama-ada-id-beda" ]; then
            echo "::error::PENYEBAB: database bernama $D1_NAME ada di akun ini tetapi dengan Database ID berbeda dari yang dipin ($D1_ID). Perbaiki database_id di wrangler.toml backend lewat PR terpisah. Tidak ada perubahan produksi."
            exit 1
          fi
          # 5. Detail database
          call GET "/d1/database/$D1_ID"
          echo "[5] Detail database     : HTTP $CODE  galat=$ERR"
          [ "$CODE" = "200" ] || { echo "::error::Database ada di daftar tetapi detailnya tidak terbaca (HTTP $CODE, galat $ERR). Berhenti."; exit 1; }
          # 6. Izin kueri (jalur yang dipakai wrangler d1 migrations): SELECT 1 saja
          call POST "/d1/database/$D1_ID/query" '{"sql":"SELECT 1 AS ok"}'
          echo "[6] Kueri baca SELECT 1 : HTTP $CODE  galat=$ERR"
          if [ "$CODE" != "200" ]; then
            echo "::error::PENYEBAB: token dapat melihat D1 tetapi TIDAK boleh menjalankan kueri (HTTP $CODE, galat $ERR). Beri izin Account > D1 > Edit pada token. Tidak ada perubahan produksi."
            exit 1
          fi
          echo "OK: akun, izin D1 Edit, dan Database ID cocok; lanjut ke migrasi."
      - name: Migrasi D1 REMOTE 0001-0003 (hanya skema; tanpa data pemain)
        if: ${{ inputs.mode == 'pasang-d1-off' }}
        working-directory: backend/worker
        run: |
          set -e
          npx --yes wrangler@4 d1 migrations list "$D1_NAME" --remote
          npx --yes wrangler@4 d1 migrations apply "$D1_NAME" --remote
      - name: Verifikasi migrasi 0001-0003 dan schema_version=3 (query baca-saja di D1 remote)
        if: ${{ inputs.mode == 'pasang-d1-off' }}
        working-directory: backend/worker
        run: |
          set -e
          q(){ npx --yes wrangler@4 d1 execute "$D1_NAME" --remote --json --command "$1" > "$RUNNER_TEMP/q.json"; }
          q "SELECT name FROM d1_migrations ORDER BY id"
          node -e 'const r=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));const n=r[0].results.map(x=>x.name);const want=["0001_d1_foundation.sql","0002_d1_samudra_podium.sql","0003_d1_migration_jobs.sql"];console.log("Migrasi terpasang:",n.join(", "));for(const w of want)if(!n.includes(w)){console.error("::error::Migrasi hilang: "+w);process.exit(1)}' "$RUNNER_TEMP/q.json"
          q "SELECT v FROM d1_schema_info WHERE k='schema_version'"
          node -e 'const r=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));const v=r[0].results[0]&&r[0].results[0].v;console.log("schema_version =",v);if(v!=="3"){console.error("::error::schema_version bukan 3");process.exit(1)}' "$RUNNER_TEMP/q.json"
          q "SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' AND name NOT LIKE '_cf_%' ORDER BY name"
          node -e 'const r=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));const n=r[0].results.map(x=>x.name);const want=["d1_audit","d1_schema_info","migration_item","migration_job","player_name","podium_entry","save_current","save_revision","sf_state"];for(const w of want)if(!n.includes(w)){console.error("::error::Tabel hilang: "+w);process.exit(1)}console.log("Tabel:",n.join(", "))' "$RUNNER_TEMP/q.json"
          q "SELECT (SELECT COUNT(*) FROM save_current) AS saves, (SELECT COUNT(*) FROM sf_state) AS sf, (SELECT COUNT(*) FROM podium_entry) AS podium"
          node -e 'const r=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));const x=r[0].results[0];console.log("Baris data pemain:",JSON.stringify(x));if(x.saves||x.sf||x.podium){console.error("::error::Data pemain seharusnya 0 (tidak ada migrasi data).");process.exit(1)}' "$RUNNER_TEMP/q.json"
      - name: Deploy nusa-api dengan NUSA_D1_MODE="off" (variabel live dipertahankan; tanpa Hosting/multiplayer)
        if: ${{ inputs.mode == 'pasang-d1-off' }}
        run: |
          set -e
          cd backend/worker
          CONFIG=".nusa-d1-config-$$.toml"; trap 'rm -f "$CONFIG"' EXIT
          # buang HANYA seksi [vars] (nilai live dipertahankan lewat --keep-vars); seksi [[d1_databases]] dan [assets] tetap
          awk '/^\[vars\][[:space:]]*$/ {skip=1; next} /^\[+[^]]+\]+[[:space:]]*$/ {skip=0} !skip {print}' wrangler.toml > "$CONFIG"
          grep -Fxq 'name = "nusa-api"' "$CONFIG"
          grep -Fxq '[[d1_databases]]' "$CONFIG" || { echo "::error::Blok D1 hilang dari config sementara."; exit 1; }
          ! grep -Fq '[vars]' "$CONFIG" || { echo "::error::vars masih ada."; exit 1; }
          npx --yes wrangler@4 deploy --config "$CONFIG" --keep-vars --strict --var NUSA_D1_MODE:off --dry-run >/dev/null
          npx --yes wrangler@4 deploy --config "$CONFIG" --keep-vars --strict --var NUSA_D1_MODE:off
      - name: Verifikasi SESUDAH deploy (binding, mode off, rute D1 404, release-status tidak berubah, Cloud Save/health utuh)
        if: ${{ inputs.mode == 'pasang-d1-off' }}
        run: |
          set -e
          curl -fsS --retry 3 --max-time 20 "$NUSA_API_BASE/api/health" >/dev/null || { echo "::error::Health gagal"; exit 1; }
          # 1) binding & mode lewat Cloudflare (bukti bound:true dan mode:off tanpa token Owner)
          curl -fsS --retry 2 --max-time 30 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/nusa-api/settings" -o "$RUNNER_TEMP/rg/set_after.json"
          node --input-type=commonjs - "$RUNNER_TEMP/rg/set_after.json" "$RUNNER_TEMP/rg/expected.json" <<'NODE'
          const fs = require('node:fs');
          const d = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const by = Object.fromEntries(d.result.bindings.map(b => [b.name, b]));
          for (const old of JSON.parse(fs.readFileSync(process.argv[3], 'utf8'))) {
            const n = by[old.name];
            if (!n || n.type !== old.type || (old.type === 'plain_text' && n.text !== old.text)) throw Error('PENTING: konfigurasi produksi berubah (' + old.name + '). Periksa rollback nusa-api.');
          }
          const db = by.NUSA_DB;
          if (!db || db.type !== 'd1' || db.id !== process.env.D1_ID) throw Error('Binding NUSA_DB tidak benar');
          if (by.NUSA_D1_MODE?.type !== 'plain_text' || by.NUSA_D1_MODE.text !== 'off') throw Error('NUSA_D1_MODE bukan off');
          if (by.NUSA_D1_MIGRATE) throw Error('NUSA_D1_MIGRATE tidak boleh ada');
          console.log('OK: variabel/secret produksi utuh; NUSA_DB (d1) terikat ke nusa-player-data; NUSA_D1_MODE=off (setara bound:true, mode:"off").');
          NODE
          # 2) rute Owner ada & terproteksi (tanpa token = 401/403, BUKAN 404)
          for p in /api/d1/status /api/d1/probe; do
            C=$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' "$NUSA_API_BASE$p" || echo 000)
            echo "$p tanpa token = HTTP $C"; case "$C" in 401|403) ;; *) echo "::error::$p seharusnya 401/403."; exit 1;; esac
          done
          # 3) seluruh /d1/v1/* tetap 404 (dengan dan tanpa token palsu)
          for m in GET PUT POST; do for p in /d1/v1/status /d1/v1/save /d1/v1/save/revisions /d1/v1/save/rollback /d1/v1/sf /d1/v1/podium/top; do
            C=$(curl -sS --max-time 20 -X "$m" -H 'Authorization: Bearer x.y.z' -o /dev/null -w '%{http_code}' "$NUSA_API_BASE$p" || echo 000)
            [ "$C" = "404" ] || { echo "::error::$m $p = HTTP $C (harus 404)."; exit 1; }
          done; done
          echo "OK: semua /d1/v1/* = 404."
          # 4) release-status tidak berubah
          CODE=$(curl -sS --retry 3 --max-time 20 -o "$RUNNER_TEMP/rg/rs_after.raw" -w '%{http_code}' "$NUSA_API_BASE/api/release-status" || echo 000)
          [ "$CODE" = "200" ] || { echo "::error::release-status SESUDAH = HTTP $CODE"; exit 1; }
          node guard/scripts/release-guard.mjs normalize < "$RUNNER_TEMP/rg/rs_after.raw" > "$RUNNER_TEMP/rg/after.json"
          node guard/scripts/release-guard.mjs compare "$RUNNER_TEMP/rg/before.json" "$RUNNER_TEMP/rg/after.json"
          # 5) Cloud Save lama: endpoint tetap hidup & terproteksi (tanpa token = 401, bukan 404/5xx); tidak menulis data apa pun
          C=$(curl -sS --max-time 20 -X POST -H 'content-type: application/json' -d '{"data":{}}' -o /dev/null -w '%{http_code}' "$NUSA_API_BASE/fn/loadSave" || echo 000)
          echo "/fn/loadSave tanpa token = HTTP $C"; [ "$C" = "401" ] || { echo "::error::Jalur Cloud Save lama tidak merespons 401 (dapat $C)."; exit 1; }
          echo "Selesai. Langkah Owner: panggil GET /api/d1/status (mode:off, bound:true) dan GET /api/d1/probe (schemaVersion:3) dengan token Owner. JANGAN aktifkan shadow/on."
      - name: ROLLBACK nusa-api ke 25e827b (variable + secret produksi dipertahankan; NUSA_DB dan NUSA_D1_MODE dihapus dari Worker)
        if: ${{ inputs.mode == 'rollback-pre-d1' }}
        run: |
          set -e
          cd backend/worker
          CONFIG=".nusa-rollback-config-$$.toml"; LOG="$RUNNER_TEMP/rollback-deploy.log"
          trap 'rm -f "$CONFIG"' EXIT
          # Config sementara: toml 25e827b TANPA [vars]; lalu [vars] disusun dari variable LIVE (sebelum), KECUALI NUSA_D1_MODE.
          # Tanpa --keep-vars supaya NUSA_D1_MODE benar-benar hilang; tanpa [[d1_databases]] supaya NUSA_DB hilang. Secret dipertahankan Cloudflare (tidak diubah).
          awk '/^\[vars\][[:space:]]*$/ {skip=1; next} /^\[+[^]]+\]+[[:space:]]*$/ {skip=0} !skip {print}' wrangler.toml > "$CONFIG"
          node --input-type=commonjs - "$RUNNER_TEMP/rg/set_before.json" "$CONFIG" <<'NODE'
          const fs = require('node:fs');
          const d = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const vars = d.result.bindings.filter(b => b.type === 'plain_text' && b.name !== 'NUSA_D1_MODE');
          if (!vars.length) throw Error('Tidak ada variable live; berhenti.');
          let out = '\n[vars]\n';
          for (const v of vars) { if (!/^[A-Za-z_][A-Za-z0-9_]*$/.test(v.name)) throw Error('Nama variable tidak aman'); out += v.name + ' = ' + JSON.stringify(String(v.text)) + '\n'; }
          fs.appendFileSync(process.argv[3], out);
          NODE
          grep -Fxq 'name = "nusa-api"' "$CONFIG"
          ! grep -Eiq 'd1_databases|NUSA_DB|NUSA_D1' "$CONFIG" || { echo "::error::Config rollback masih memuat D1."; exit 1; }
          # keluaran wrangler memuat nilai variable plain-text: simpan ke berkas, jangan ke log; tampilkan hanya baris non-"env."
          show(){ grep -v '^[[:space:]]*env\.' "$LOG" | tail -40 || true; }
          npx --yes wrangler@4 deploy --config "$CONFIG" --strict --dry-run > "$LOG" 2>&1 || { show; echo "::error::Build rollback gagal. Produksi belum disentuh."; exit 1; }
          npx --yes wrangler@4 deploy --config "$CONFIG" --strict > "$LOG" 2>&1 || { show; echo "::error::Deploy rollback gagal. Periksa produksi segera."; exit 1; }
          show
      - name: Verifikasi SESUDAH rollback (binding D1 hilang, variable/secret utuh, release-status sama, jalur lama hidup)
        if: ${{ inputs.mode == 'rollback-pre-d1' }}
        run: |
          set -e
          curl -fsS --retry 3 --max-time 20 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/nusa-api/settings" -o "$RUNNER_TEMP/rg/set_after.json"
          node --input-type=commonjs - "$RUNNER_TEMP/rg/set_after.json" "$RUNNER_TEMP/rg/expected.json" <<'NODE'
          const fs = require('node:fs');
          const d = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const list = d.result.bindings, by = Object.fromEntries(list.map(b => [b.name, b]));
          for (const old of JSON.parse(fs.readFileSync(process.argv[3], 'utf8'))) {
            const n = by[old.name];
            if (!n || n.type !== old.type || (old.type === 'plain_text' && n.text !== old.text)) throw Error('PENTING: konfigurasi produksi berubah (' + old.name + '). Pulihkan segera.');
          }
          for (const a of JSON.parse(fs.readFileSync(process.argv[3] + '.assets', 'utf8'))) if (by[a]?.type !== 'assets') throw Error('Binding assets hilang: ' + a);
          if (by.NUSA_DB || by.NUSA_D1_MODE) throw Error('Binding/variable D1 masih ada setelah rollback');
          if (list.some(b => b.type === 'd1')) throw Error('Masih ada binding bertipe d1');
          console.log('OK: variable + secret produksi utuh; NUSA_DB dan NUSA_D1_MODE sudah dihapus dari Worker. Tabel D1 tidak disentuh.');
          NODE
          bash "$RUNNER_TEMP/probe.sh" after
          # kode HTTP tiap probe harus sama dengan sebelum (health, public-config, release-status, Cloud Save, pembayaran/QRIS, SF, Podium)
          diff "$RUNNER_TEMP/probe_before.txt" "$RUNNER_TEMP/probe_after.txt" || { echo "::error::Perilaku endpoint lama berubah sesudah rollback."; exit 1; }
          grep -q '^200 GET /api/health' "$RUNNER_TEMP/probe_after.txt"
          for p in /d1/v1/status /d1/v1/save /d1/v1/sf /d1/v1/podium/top; do
            C=$(curl -sS --max-time 20 -X GET -H 'Authorization: Bearer x.y.z' -o /dev/null -w '%{http_code}' "$NUSA_API_BASE$p" || echo 000)
            [ "$C" = "404" ] || { echo "::error::$p = HTTP $C (harus 404)."; exit 1; }
          done
          CODE=$(curl -sS --retry 3 --max-time 20 -o "$RUNNER_TEMP/rg/rs_after.raw" -w '%{http_code}' "$NUSA_API_BASE/api/release-status" || echo 000)
          [ "$CODE" = "200" ] || { echo "::error::release-status SESUDAH = HTTP $CODE"; exit 1; }
          node guard/scripts/release-guard.mjs normalize < "$RUNNER_TEMP/rg/rs_after.raw" > "$RUNNER_TEMP/rg/after.json"
          node guard/scripts/release-guard.mjs compare "$RUNNER_TEMP/rg/before.json" "$RUNNER_TEMP/rg/after.json"
          curl -fsS --max-time 20 "$NUSA_API_BASE/api/public-config" -o "$RUNNER_TEMP/rg/pc_after.json"
          node guard/scripts/release-guard.mjs shop "$RUNNER_TEMP/rg/pc_before.json" "$RUNNER_TEMP/rg/pc_after.json"
          echo "OK: rollback selesai. release-status sama; health, Cloud Save, pembayaran/QRIS, SF dan Podium tetap hidup; /d1/v1/* = 404. D1 (tabel/data) tidak dihapus."
