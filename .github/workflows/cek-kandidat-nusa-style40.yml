name: Cek Kandidat +40% (tanpa deploy)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/rilis-nusa-style-plus40-20261107.yml'
      - '.github/workflows/cek-kandidat-nusa-style40.yml'
permissions:
  contents: read
jobs:
  test:
    name: Uji game + peta + Aurora + Firebase sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: hanifan-dot/Nusa-island
          ref: 4172b58b4813a86f8974ed092baadb217d75c4f9
          path: game
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pastikan semua berkas wajib lengkap
        run: |
          set -euo pipefail
          for f in firebase/scripts/deploy-api-kandidat.sh firebase/scripts/cf-auth-check.sh tests/unit-cf-auth.js tests/unit-economy.js tests/unit-aurora.js tests/unit-map-ext.js tests/unit-cloud.js tests/unit-mp.js; do
            test -s "game/$f" || { echo "::error::Berkas hilang: $f"; exit 1; }
          done
          bash -n game/firebase/scripts/deploy-api-kandidat.sh
          bash -n game/firebase/scripts/cf-auth-check.sh
          bash -n game/firebase/scripts/rilis.sh
      - name: Pastikan seluruh Firebase Functions lib sesuai sumber game
        working-directory: game
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const pairs = [['economy/core.js','economy-core.js'],['economy/tables.js','economy-tables.js'],['fishmath.js','fishmath.js'],['streak/core.js','streak-core.js'],['event/core.js','event-core.js'],['house/core.js','house-core.js'],['username/core.js','name-core.js'],['economy/pond-core.js','pond-core.js'],['economy/fashion-core.js','fashion-core.js'],['economy/sf-core.js','sf-core.js'],['economy/aurora-core.js','aurora-core.js']];
          for (const [src,dst] of pairs) {
            const header = '// SALINAN OTOMATIS dari '+src+' — jangan diedit di sini (node firebase/scripts/sync-economy.js).\n';
            const expected = header+fs.readFileSync(src,'utf8');
            const actual = fs.readFileSync('firebase/functions/lib/'+dst,'utf8');
            if (expected !== actual) { console.error('::error::Salinan Firebase kedaluwarsa: '+dst); process.exitCode=1; }
            else console.log('OK '+dst);
          }
          NODE
      - name: Regresi game (tanpa jaringan dan tanpa secret produksi)
        working-directory: game
        run: |
          set -e
          node firebase/scripts/cek-rilis.js
          node tests/unit-map-ext.js
          node tests/unit-cloud.js
          node tests/unit-economy.js
          node tests/unit-aurora.js
          node tests/unit-mp.js
          node tests/unit-cf-auth.js
      - name: Bandingkan index.html situs LIVE dengan kandidat (sama seperti tahap pre-deploy produksi)
        working-directory: game
        run: node firebase/scripts/cek-rilis.js --live https://nusa-island-d2023.web.app --require-live
      - name: Build hosting produksi tiruan dan periksa utuh
        working-directory: game
        run: |
          NUSA_API_BASE=https://nusa-api.contoh.workers.dev NUSA_MP_WS=wss://nusa-multiplayer.contoh.workers.dev bash firebase/scripts/build-hosting.sh produksi
          node firebase/scripts/cek-rilis.js --build firebase/public --live https://nusa-island-d2023.web.app --require-live
      - name: Tes inti tambahan (SF server, Podium, Rumahku Sosial, ekonomi, Cloud Save)
        working-directory: game
        run: |
          set -e
          for t in unit-sf-server unit-podium unit-house-social unit-mp-house unit-shop unit-fashion unit-pond unit-rilis; do node tests/$t.js; done
